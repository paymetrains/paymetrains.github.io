name: Deploy roster pay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check calculator and parser
        run: npm test --prefix roster-analyser
      - name: Upload active app only
        uses: actions/upload-pages-artifact@v4
        with:
          path: roster-analyser
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
